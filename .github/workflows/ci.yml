name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: ruff check agentforge tests scripts
      - run: mypy agentforge
      - run: python -m pytest --cov=agentforge --cov-report=term-missing --cov-fail-under=75
      - run: python -m compileall -q agentforge

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest tests/test_api.py -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m build --sdist --wheel --outdir dist
      - run: python -m venv /tmp/agentforge-package-venv
      - run: /tmp/agentforge-package-venv/bin/python -m pip install -r requirements.lock
      - run: /tmp/agentforge-package-venv/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/agentforge-package-venv/bin/agentforge --help

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: docker version
      - run: python -m pytest -m integration tests/integration/test_container_sandbox.py -q
